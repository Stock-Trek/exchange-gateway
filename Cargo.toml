[package]
name = "exchange-gateway"
version = "0.11.0"
edition = "2024"
description = "A gateway library for connecting to cryptocurrency exchange APIs over HTTP and WebSocket, with authentication, rate limiting, and request/response handling"
repository = "https://github.com/Stock-Trek/exchange-gateway"

[dependencies]
async-trait = "0.1.89"
exchange-types = { version = "0.11.0", registry = "shipyard" }
futures-timer = "3.0"
httpdate = "1.0.3"
iris = { version = "1.0.4", registry = "shipyard", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }

[features]
default = ["auto-resync", "iris", "reqwest"]
auto-resync = ["dep:tokio"]
iris = ["dep:iris"]
reqwest = ["dep:reqwest"]

[lints.clippy]
too_many_arguments = "allow"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = ["auto-resync", "iris", "reqwest"]
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]

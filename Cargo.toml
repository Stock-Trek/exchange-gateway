[package]
name = "exchange-gateway"
version = "0.1.1"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bs58 = "0.5.1"
chrono = "0.4.44"
data-encoding = "2.11.0"
ed25519-dalek = { version = "2", features = ["pem"] }
futures = "0.3.32"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.8"
rust_decimal = "1.42.0"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10"
signature = "2"
stock-trek = "0.7.5"
strum = "0.28.0"
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4"] }

[lints.clippy]
new_ret_no_self = "allow"

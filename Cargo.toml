[package]
name = "exchange-gateway"
version = "0.7.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
bimap = "0.6.3"
bs58 = "0.5.1"
data-encoding = "2.11.0"
ed25519-compact = "2.3.0"
exchange-types = { version = "0.4.1", registry = "shipyard" }
hashbrown = "0.17.1"
hmac = "0.12"
p256 = "0.13"
p384 = "0.13"
rust_decimal = "1.42.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_urlencoded = "0.7.1"
sha2 = "0.10"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["v4"] }

[features]
default = ["serde"]
serde = [
    "dep:serde",
    "exchange-types/serde",
    "hashbrown/serde",
    "secrecy/serde",
]

[lints.clippy]
new_ret_no_self = "allow"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = []
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]

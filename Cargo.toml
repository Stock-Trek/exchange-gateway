[package]
name = "authentication-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.44"
hex = "0.4.3"
rust_decimal = "1.42.0"
serde = "1.0.228"
serde_json = "1.0.149"
ed25519-dalek = { version = "2", features = ["pem"] }
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.8"
sha2 = "0.10"
signature = "2"
stock-trek = "0.6.7"
strum = "0.28.0"
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4"] }

[package]
name = "exchange-gateway"
version = "0.9.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bs58 = "0.5.1"
data-encoding = "2.11.0"
ed25519-compact = "2.3.0"
exchange-types = { version = "0.4.6", registry = "shipyard" }
futures-timer = "3.0"
hmac = "0.12"
iris = { version = "1.0.0", registry = "shipyard", optional = true }
p256 = "0.13"
p384 = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
sha2 = "0.10"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["v4"] }

[features]
default = []
iris = ["dep:iris", "dep:serde_json", "dep:serde"]
reqwest = ["dep:reqwest"]
serde = [
    "dep:serde",
    "exchange-types/serde",
    "secrecy/serde",
]

[dev-dependencies]
ctor = "0.2"
futures = "0.3"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1"
tokio-websockets = { version = "0.13", features = ["server", "ring"] }

[lints.clippy]
new_ret_no_self = "allow"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = ["iris", "reqwest", "serde"]
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]
